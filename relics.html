<body>
<script src="js/core.js?v=5.1"></script>
<script src="js/relics.js"></script>
<script src="js/shell.js?v=5.1"></script>
<main>
  <div class="page-header">
    <div>
      <div class="page-title" data-en="VOID RELICS" data-de="VOID-RELICS">VOID RELICS</div>
      <div class="page-sub" data-en="Browse drops · Refinement calculator · Market prices" data-de="Drops durchsuchen · Verfeinerungs-Rechner · Marktpreise">Browse drops · Refinement calculator · Market prices</div>
    </div>
    <span class="badge-count" id="relicCountBadge">—</span>
  </div>

  <!-- Relic filter row -->
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
    <button class="tier-btn tier-filter-btn on" onclick="setRelicFilter('tier','all',this)" data-en="All Tiers" data-de="Alle Tiers">All Tiers</button>
    <button class="tier-btn tier-filter-btn" onclick="setRelicFilter('tier','Lith',this)">Lith</button>
    <button class="tier-btn tier-filter-btn" onclick="setRelicFilter('tier','Meso',this)">Meso</button>
    <button class="tier-btn tier-filter-btn" onclick="setRelicFilter('tier','Neo',this)">Neo</button>
    <button class="tier-btn tier-filter-btn" onclick="setRelicFilter('tier','Axi',this)">Axi</button>
    <button class="tier-btn tier-filter-btn" onclick="setRelicFilter('tier','Requiem',this)">Requiem</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
    <button class="tier-btn vault-filter-btn on" onclick="setRelicFilter('vaulted','both',this)" data-en="All" data-de="Alle">All</button>
    <button class="tier-btn vault-filter-btn" onclick="setRelicFilter('vaulted','unvaulted',this)" data-en="Unvaulted" data-de="Nicht im Tresor">Unvaulted</button>
    <button class="tier-btn vault-filter-btn" onclick="setRelicFilter('vaulted','vaulted',this)" data-en="Vaulted" data-de="Im Tresor">Vaulted</button>
  </div>
  <input class="search-input" id="relicSearch" type="search" style="margin-bottom:14px"
         placeholder="Search relic or part name…" oninput="onRelicSearch(this.value)">

  <div id="relicGrid"></div>

  <!-- Refinement Modal -->
  <div class="refine-modal-backdrop" id="refineModal">
    <div class="refine-modal-bg" onclick="closeRefineModal()"></div>
    <div class="refine-modal-panel">
      <div id="refineModalBody"></div>
      <button class="refine-close-btn" onclick="closeRefineModal()" data-en="Close" data-de="Schließen">Close</button>
    </div>
  </div>

  <!-- Market price checker -->
  <div style="margin-top:32px">
    <div class="page-header" style="margin-bottom:10px">
      <div class="page-title" style="font-size:15px" data-en="MARKET PRICE CHECK" data-de="MARKTPREISE">MARKET PRICE CHECK</div>
    </div>
    <input class="search-input" id="mktSearchInput" type="search" style="margin-bottom:10px"
           placeholder="Search item on warframe.market…" oninput="onMktSearch(this.value)">
    <div id="mktResults"></div>
  </div>
</main>
<script>
function pageInit()    { loadRelics(); }
function pageRefresh() { loadRelics(); }
bootPage();
</script>
