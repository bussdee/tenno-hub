<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a84b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c8a84b" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#c8a84b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blueglow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58c4f0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58c4f0" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#58c4f0" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="softblur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity=".04" stroke="#c8a84b" stroke-width=".5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glow accent bars -->
  <rect x="0" y="310" width="1200" height="2" fill="url(#glow)" filter="url(#blur)"/>
  <rect x="0" y="308" width="1200" height="6" fill="url(#blueglow)" filter="url(#softblur)" opacity=".5"/>

  <!-- Large background hexagons (decorative) -->
  <polygon points="980,80 1120,160 1120,320 980,400 840,320 840,160" fill="none" stroke="#c8a84b" stroke-width="1" opacity=".08"/>
  <polygon points="980,130 1070,182 1070,286 980,338 890,286 890,182" fill="none" stroke="#58c4f0" stroke-width=".8" opacity=".1"/>
  <polygon points="100,300 220,365 220,495 100,560 -20,495 -20,365" fill="none" stroke="#c8a84b" stroke-width="1" opacity=".07"/>

  <!-- Central hero hex logo -->
  <polygon points="200,180 280,224 280,312 200,356 120,312 120,224" fill="none" stroke="#c8a84b" stroke-width="2.5" opacity=".9"/>
  <polygon points="200,205 262,241 262,313 200,349 138,313 138,241" fill="none" stroke="#58c4f0" stroke-width="1.2" opacity=".55"/>
  <circle cx="200" cy="268" r="10" fill="#c8a84b"/>
  <!-- spokes -->
  <line x1="200" y1="205" x2="200" y2="230" stroke="#c8a84b" stroke-width="2" opacity=".8"/>
  <line x1="200" y1="306" x2="200" y2="349" stroke="#c8a84b" stroke-width="2" opacity=".8"/>
  <line x1="138" y1="241" x2="157" y2="252" stroke="#c8a84b" stroke-width="2" opacity=".8"/>
  <line x1="262" y1="313" x2="243" y2="302" stroke="#c8a84b" stroke-width="2" opacity=".8"/>
  <line x1="262" y1="241" x2="243" y2="252" stroke="#c8a84b" stroke-width="2" opacity=".8"/>
  <line x1="138" y1="313" x2="157" y2="302" stroke="#c8a84b" stroke-width="2" opacity=".8"/>

  <!-- TENNO.HUB wordmark -->
  <text x="320" y="230" font-family="'Arial Black', Arial, sans-serif" font-size="78" font-weight="900"
        letter-spacing="12" fill="#c8a84b" opacity=".95">TENNO.HUB</text>

  <!-- Underline accent -->
  <rect x="320" y="246" width="580" height="2" fill="#c8a84b" opacity=".4"/>

  <!-- Tagline -->
  <text x="320" y="290" font-family="Arial, sans-serif" font-size="22" font-weight="400"
        letter-spacing="5" fill="#8a9bb4">WARFRAME COMPANION · DE / EN</text>

  <!-- Feature pills -->
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">
    <!-- Pill 1 -->
    <rect x="320" y="328" width="152" height="34" rx="17" fill="#0d1117" stroke="#c8a84b" stroke-width="1" opacity=".7"/>
    <text x="396" y="350" text-anchor="middle" fill="#c8a84b">◈ FISSURES</text>
    <!-- Pill 2 -->
    <rect x="484" y="328" width="148" height="34" rx="17" fill="#0d1117" stroke="#58c4f0" stroke-width="1" opacity=".7"/>
    <text x="558" y="350" text-anchor="middle" fill="#58c4f0">◉ NIGHTWAVE</text>
    <!-- Pill 3 -->
    <rect x="644" y="328" width="138" height="34" rx="17" fill="#0d1117" stroke="#00e0a0" stroke-width="1" opacity=".7"/>
    <text x="713" y="350" text-anchor="middle" fill="#00e0a0">⚔ INVASIONS</text>
    <!-- Pill 4 -->
    <rect x="794" y="328" width="100" height="34" rx="17" fill="#0d1117" stroke="#b57bee" stroke-width="1" opacity=".7"/>
    <text x="844" y="350" text-anchor="middle" fill="#b57bee">⬟ RELICS</text>
    <!-- Row 2 -->
    <rect x="320" y="374" width="114" height="34" rx="17" fill="#0d1117" stroke="#c8a84b" stroke-width="1" opacity=".6"/>
    <text x="377" y="396" text-anchor="middle" fill="#c8a84b">◆ BARO</text>
    <rect x="446" y="374" width="118" height="34" rx="17" fill="#0d1117" stroke="#58c4f0" stroke-width="1" opacity=".6"/>
    <text x="505" y="396" text-anchor="middle" fill="#58c4f0">💀 LICH</text>
    <rect x="576" y="374" width="128" height="34" rx="17" fill="#0d1117" stroke="#00e0a0" stroke-width="1" opacity=".6"/>
    <text x="640" y="396" text-anchor="middle" fill="#00e0a0">🏗 FOUNDRY</text>
    <rect x="716" y="374" width="126" height="34" rx="17" fill="#0d1117" stroke="#ff9040" stroke-width="1" opacity=".6"/>
    <text x="779" y="396" text-anchor="middle" fill="#ff9040">🗺 ROADMAP</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#0d1117" opacity=".8"/>
  <rect x="0" y="590" width="1200" height="1" fill="#c8a84b" opacity=".25"/>

  <!-- Bottom text -->
  <text x="600" y="616" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
        letter-spacing="3" fill="#4d5e74">familienfabrik.at · FREE · PWA · PC · PSN · XBX · NSW</text>

  <!-- "KOSTENLOS" / Free badge -->
  <rect x="1090" y="38" width="92" height="32" rx="6" fill="#00e0a0" opacity=".15" stroke="#00e0a0" stroke-width="1"/>
  <text x="1136" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="13"
        font-weight="700" letter-spacing="2" fill="#00e0a0">FREE</text>
</svg>
